name: Update Database

on:
  schedule:
    - cron: '0 0 * * *'  # Run daily at midnight UTC
  workflow_dispatch:     # Allow manual trigger

jobs:
  update-data:
    runs-on: ubuntu-latest
    # Add this permission block
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3
        with:
          # Set fetch-depth to 0 to get all history
          fetch-depth: 0
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Fetch latest data
        run: |
          mkdir -p data
          node scripts/scrapeHoldings.js
          node scripts/fetchPrices.js
        env:
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}

      - name: Create metadata file
        run: |
          echo "{\"lastUpdated\":\"$(date -u +"%Y-%m-%dT%H:%M:%SZ")\"}" > data/metadata.json
          
      - name: Push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/holdings.db
          git add data/metadata.json
          git commit -m "Update database with latest data [skip ci]" || echo "No changes to commit"
          git push
