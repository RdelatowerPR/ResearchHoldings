# .github/workflows/update-data.yml
name: Update Database

on:
  schedule:
    - cron: '0 0 * * *'  # Run daily at midnight UTC
  workflow_dispatch:     # Allow manual trigger

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Fetch latest data
        run: |
          mkdir -p data
          node scripts/scrapeHoldings.js
          node scripts/fetchPrices.js
        env:
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
          
      # In your GitHub Actions workflow
      - name: Create metadata file
        run: |
          echo "{\"lastUpdated\":\"$(date -u +"%Y-%m-%dT%H:%M:%SZ")\"}" > data/metadata.json
          
      - name: Commit and push if changes
        run: |
          git config --global user.name 'GitHub Action'
          git config --global user.email 'action@github.com'
          git add data/holdings.db
          git add data/metadata.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Update database with latest data [skip ci]"
          git push